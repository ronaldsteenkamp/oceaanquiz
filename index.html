<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5fa5">
  <title>Oceaanquiz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2329a3e0'/><stop offset='1' stop-color='%230b4f8f'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M6 19c3-4 6-4 9 0s6 4 11 0' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/><path d='M10 13c2-3 5-4 9-2' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' opacity='.7'/></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Oceaanquiz">
  <meta name="description" content="Herken 464 zeedieren aan hun foto, met feitjes en verspreidingskaarten.">
  <meta name="author" content="Ronald Steenkamp">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="appbar" id="appbar">
    <div class="appbar-inner">
      <button class="brand" data-nav="home" aria-label="Naar start">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">Oceaanquiz</span>
      </button>
      <nav class="nav" aria-label="Hoofdmenu">
        <button data-nav="home" class="nav-link">Spelen</button>
        <button data-nav="guide" class="nav-link">Dierengids</button>
        <button data-nav="about" class="nav-link">Over</button>
      </nav>
      <div class="appbar-right">
        <div class="collect-pill" id="collect-pill" title="Dieren die je goed hebt geraden"></div>
        <button class="icon-btn" id="theme-toggle" aria-label="Wissel licht/donker thema"></button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Feedbackbalk onderaan tijdens de quiz (Duolingo-stijl) -->
  <div class="feedback" id="feedback" hidden>
    <div class="feedback-inner">
      <div class="feedback-icon" id="fb-icon"></div>
      <div class="feedback-text">
        <strong id="fb-title"></strong>
        <span id="fb-sub"></span>
      </div>
      <button class="btn btn-lg" id="fb-next">Doorgaan</button>
    </div>
  </div>

  <dialog class="sheet" id="detail" aria-labelledby="d-title"></dialog>

  <script src="data.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
